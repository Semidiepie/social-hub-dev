<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Solid orange app-icon background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF7A4C" />
      <stop offset="100%" stop-color="#F06131" />
    </linearGradient>
  </defs>

  <!-- Rounded-square canvas: brand orange -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bg)" />

  <!-- Black gaming controller — chunky "wing" pad centered on the icon -->
  <g transform="translate(122,320)">
    <!-- Body -->
    <path
      d="M 180 40
         C 80 40, 20 116, 20 240
         C 20 344, 62 424, 158 448
         C 208 460, 254 438, 292 402
         C 328 368, 366 356, 390 356
         C 414 356, 452 368, 488 402
         C 526 438, 572 460, 622 448
         C 718 424, 760 344, 760 240
         C 760 116, 700 40, 600 40
         C 520 40, 460 76, 390 76
         C 320 76, 260 40, 180 40 Z"
      fill="#12141c"
    />

    <!-- D-pad (left) — white plus -->
    <g transform="translate(160,196)" fill="#FFFFFF">
      <rect x="-16" y="-52" width="32" height="104" rx="7" />
      <rect x="-52" y="-16" width="104" height="32" rx="7" />
    </g>

    <!-- Action buttons (right) — two solid white circles -->
    <g fill="#FFFFFF">
      <circle cx="620" cy="176" r="22" />
      <circle cx="672" cy="228" r="22" />
    </g>

    <!-- Analog sticks (small, subtle) -->
    <g fill="#FFFFFF" opacity="0.9">
      <circle cx="278" cy="298" r="20" />
      <circle cx="502" cy="298" r="20" />
    </g>
  </g>

  <!-- LIVE badge — red pill top-right corner -->
  <g transform="translate(720,138)">
    <rect x="0" y="0" width="200" height="86" rx="43" fill="#E63946" />
    <rect x="0" y="0" width="200" height="86" rx="43" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.35" />
    <text
      x="100"
      y="58"
      text-anchor="middle"
      font-family="'Inter','Helvetica Neue',Arial,sans-serif"
      font-weight="900"
      font-size="44"
      letter-spacing="2"
      fill="#FFFFFF"
    >LIVE</text>
  </g>
</svg>
